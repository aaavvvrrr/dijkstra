services:
  maritime-router:
    build: .
    container_name: dijkstra_routing_engine
    ports:
      - "8000:8000"
    volumes:
      # Прокидываем папку с тяжелыми растрами внутрь контейнера,
      # чтобы не билдить 10-гигабайтные матрицы в Docker-образ
      - ./data:/app_root/data
      # Прокидываем конфиг для быстрого изменения дат без пересборки контейнера
      - ./config.json:/app_root/config.json
      # Прокидываем сам код для Hot-Reloading без пересборки Docker!
      - ./app:/app_root/app
      # Прокидываем папку с автотестами на хост-машину
      - ./tests:/app_root/tests
    environment:
      - APP_CONFIG_PATH=/app_root/config.json
    restart: unless-stopped